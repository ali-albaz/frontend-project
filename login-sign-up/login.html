<script>
  const carousel = document.getElementById('carousel');
  const dots = document.querySelectorAll('.dot');

  let index = 0;
  const total = dots.length;

  function updateCarousel() {
    carousel.style.transform = `translateX(-${index * 100}%)`;

    dots.forEach((dot, i) => {
      dot.classList.remove('bg-[#8DD3BB]');
      dot.classList.add('bg-white');

      dot.classList.remove('rounded-3xl');
      dot.classList.add('rounded-full');

      dot.classList.remove('w-8');
      dot.classList.add('w-3');

      if (i === index) {
        dot.classList.add('bg-[#8DD3BB]');
        dot.classList.remove('bg-white');

        dot.classList.add('rounded-3xl');
        dot.classList.remove('rounded-full');

        dot.classList.add('w-8');
        dot.classList.remove('w-3');
      }
    });
  }

  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      index = i;
      updateCarousel();
    });
  });

  // Auto slide
  setInterval(() => {
    index = (index + 1) % total;
    updateCarousel();
  }, 4000);

  updateCarousel();
</script>
